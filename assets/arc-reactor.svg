<svg width="820" height="240" viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#7df9ff"/>
      <stop offset="60%" stop-color="#00c3ff"/>
      <stop offset="100%" stop-color="#001a33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hudLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark metallic background -->
  <rect width="820" height="240" rx="14" fill="#050a12"/>
  <rect x="1.5" y="1.5" width="817" height="237" rx="13" fill="none" stroke="#0e2a3d" stroke-width="1.5"/>

  <!-- grid -->
  <g stroke="#0b2233" stroke-width="0.6">
    <line x1="0" y1="60" x2="820" y2="60"/><line x1="0" y1="120" x2="820" y2="120"/><line x1="0" y1="180" x2="820" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="240"/><line x1="700" y1="0" x2="700" y2="240"/>
  </g>

  <!-- ARC REACTOR CORE (left) -->
  <g transform="translate(120,120)">
    <circle r="58" fill="url(#coreGlow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#eaffff" filter="url(#glow)">
      <animate attributeName="r" values="14;17;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- rotating segmented ring -->
    <g filter="url(#glow)">
      <circle r="34" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="16 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- counter-rotating outer ring -->
    <circle r="48" fill="none" stroke="#0aa5c9" stroke-width="2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="55" fill="none" stroke="#083b52" stroke-width="1.5"/>
  </g>

  <!-- RADAR (right) -->
  <g transform="translate(700,120)">
    <circle r="52" fill="#04121d" stroke="#0e3a52" stroke-width="1.5"/>
    <circle r="36" fill="none" stroke="#0e3a52" stroke-width="1"/>
    <circle r="20" fill="none" stroke="#0e3a52" stroke-width="1"/>
    <line x1="-52" y1="0" x2="52" y2="0" stroke="#0e3a52" stroke-width="1"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#0e3a52" stroke-width="1"/>
    <!-- sweep -->
    <path d="M0,0 L52,0 A52,52 0 0,0 36.8,-36.8 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- blips -->
    <circle cx="22" cy="-14" r="2.5" fill="#ff3b3b">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-18" cy="24" r="2.5" fill="#ffd76a">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CENTER HUD TEXT -->
  <g font-family="Courier New, monospace" text-anchor="middle">
    <text x="410" y="86" fill="#e8faff" font-size="30" font-weight="bold" letter-spacing="6" filter="url(#glow)">N I K H I L &#160; K U M A R</text>
    <text x="410" y="116" fill="#00e5ff" font-size="13" letter-spacing="3">AI / ML ENGINEER — AUTONOMOUS SYSTEMS DIVISION</text>
    <rect x="250" y="132" width="320" height="1.5" fill="url(#hudLine)"/>
    <text x="410" y="158" fill="#7ee1f5" font-size="11" letter-spacing="2">
      SYSTEM ONLINE
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
    <!-- loading bar -->
    <rect x="285" y="172" width="250" height="8" rx="4" fill="#07202e" stroke="#0e3a52" stroke-width="1"/>
    <rect x="287" y="174" width="0" height="4" rx="2" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="width" values="0;246;246;0" keyTimes="0;0.45;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="410" y="200" fill="#5f8fa3" font-size="10" letter-spacing="2">LLM CORE · RAG PIPELINE · VISION MODULE · AGENT MESH — ALL SYSTEMS NOMINAL</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M14,30 L14,14 L30,14"/>
    <path d="M790,14 L806,14 L806,30"/>
    <path d="M806,210 L806,226 L790,226"/>
    <path d="M30,226 L14,226 L14,210"/>
  </g>
</svg>
